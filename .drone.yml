kind: pipeline
type: docker
name: deploy-to-baota

steps:
- name: scp-files
  image: appleboy/drone-scp
  settings:
    host:
      from_secret: baota_host
    username:
      from_secret: baota_user
    port: 2222
    key:
      from_secret: ssh_private_key
    # source 是你要传的文件，可以用通配符，比如 source: ./* 或者指定 index.html
    source: index.html 
    # target 是宝塔里的目标文件夹（注意最后那个斜杠必须要有）
    target: /www/wwwroot/default/
    # 如果你想把整个目录传过去，加上这句去掉最外层目录
    strip_components: 0